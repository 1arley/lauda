services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/laudos_saas_production
      DB_HOST: db
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-d8d189adbab97dd74e84c258aff0c335}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  bundle:
