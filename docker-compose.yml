# Producao do Lauda. Imagem publicada por .github/workflows/publish-image.yml
# a cada push na branch principal; este arquivo e copiado para /srv/lauda/ na
# VPS, que e onde os containers rodam (nao ha build na VPS).
# TLS fica com o Traefik da maquina, que ja emite certificado via Let's Encrypt
# para a rede `web`; por isso nao ha servico de proxy reverso aqui e as portas
# 80/443 nao sao publicadas.
name: lauda

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGE_NAME:-ghcr.io/1arley/lauda}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Defina SECRET_KEY_BASE no .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_HOST: db
      LAUDOS_SAAS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_HOST: ${APP_HOST:?Defina APP_HOST no .env}
      APP_PROTOCOL: https
      MAILER_SENDER: ${MAILER_SENDER:?Defina MAILER_SENDER no .env}
      SMTP_ADDRESS: ${SMTP_ADDRESS:?Defina SMTP_ADDRESS no .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER_NAME: ${SMTP_USER_NAME:?Defina SMTP_USER_NAME no .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Defina SMTP_PASSWORD no .env}
      SMTP_DOMAIN: ${SMTP_DOMAIN:?Defina SMTP_DOMAIN no .env}
      STORAGE_SERVICE: local
      SOLID_QUEUE_IN_PUMA: "true"
      PORT: 80
    expose:
      - "80"
    volumes:
      - app_storage:/rails/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --header 'Host: $${APP_HOST}' http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.lauda.entrypoints: "websecure"
      traefik.http.routers.lauda.rule: "Host(`${APP_HOST:?Defina APP_HOST no .env}`)"
      traefik.http.routers.lauda.service: "lauda"
      traefik.http.routers.lauda.tls: "true"
      traefik.http.routers.lauda.tls.certresolver: "letsencrypt"
      traefik.http.services.lauda.loadbalancer.server.port: "80"
      com.centurylinklabs.watchtower.enable: "true"

networks:
  web:
    external: true

volumes:
  pgdata:
  app_storage:
